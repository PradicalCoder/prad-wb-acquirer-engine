# All tunable settings for the engine, read once at startup by config.py.
# Secrets (the API key) live in .env, never here.
# Each setting notes what it means and which part of the code reads it.


# ---------------------------------------------------------------------------
# paths: where files are read from and written to
# ---------------------------------------------------------------------------
paths:
  # The deal dataset (500 past M&A transactions). Loaded once by the data loader.
  data_csv: data/ma_transactions_500.csv

  # Each run writes a timestamped folder here (HTML and Markdown report,
  # run.log, run_report.json). Created by the CLI.
  runs_dir: runs

  # Local database of past LLM answers. Asking the exact same question twice
  # returns the stored answer instead of calling the API. Used by the LLM client.
  llm_cache: .cache/llm_cache.sqlite


# ---------------------------------------------------------------------------
# The request used when `acquirer-engine run` is given no --text.
# The CLI passes it to the intake agent, which turns it into structured fields.
# ---------------------------------------------------------------------------
default_banker_text: >-
  I need to quickly identify the 10 most likely acquirers for a $200M healthcare
  services company. Sector: Healthcare Services, Deal Size: ~$200M EV,
  Profile: Mid-market, private, regional, strong EBITDA margins.


# ---------------------------------------------------------------------------
# default_target: the same request, already structured.
# Safety net: if the intake LLM call fails on the default text, the run uses
# these fields instead of stopping.
# ---------------------------------------------------------------------------
default_target:
  # One of the 10 sectors in the dataset. Drives sector weights, margin bands
  # and the valuation comps.
  sector: Healthcare Services

  # Enterprise value in $M. Size similarity of every past deal is measured
  # against this number.
  ev_mm: 200.0

  # Which pre-sale owner types count as "private". Both are privately held.
  # Past deals whose target had one of these owners get full ownership weight.
  ownership: [Private, PE-Backed]

  # A single region (e.g. Midwest), or null if none was named. null means
  # geography is ignored when scoring deals rather than guessed.
  region: null

  # weak / medium / strong margins, judged against the target's own sector
  # (strong = top 35% of the sector). Used to estimate revenue and EBITDA.
  margin_band: strong


# ---------------------------------------------------------------------------
# scoring: how relevant each past deal is, and how buyers are shortlisted.
# Read by the scoring code (no LLM involved).
#
# Every past deal gets a relevance score from 0 to 1:
#   relevance = sector x size x deal type x ownership x margin x geography x recency
# Each factor is a weight between 0 and 1, so one big mismatch (wrong sector,
# very different size) pulls the score down hard; small mismatches only trim it.
# ---------------------------------------------------------------------------
scoring:
  # --- Sector -------------------------------------------------------------
  # Deals in the target's own sector always get 1.0.
  # A deal in another sector gets sector_mult x lift, where lift says how often
  # buyers of the target's sector also buy in that one (1.0 = normal rate).
  # So a sector with normal overlap gets 0.5; a strongly linked one gets more.
  sector_mult: 0.5
  # Lowest weight for an unrelated sector: it still counts a little.
  sector_floor: 0.1
  # Highest weight for another sector: it can never equal the target's own (1.0).
  sector_cap: 0.9

  # --- Size ---------------------------------------------------------------
  # Size is judged in doublings, not dollars: half or double the target's
  # size are equally far away.
  #   weight = max(size_base ^ (doublings away ^ 2), size_floor)
  # With 0.8: 2x or 0.5x -> 0.80, 4x or 0.25x -> 0.41, 8x or 0.125x -> 0.13.
  size_base: 0.8
  # Any deal, however far off in size, counts at least this much.
  size_floor: 0.05

  # --- Deal type ----------------------------------------------------------
  # The seller is offering the whole company, so deals where the buyer took
  # control of a whole company are the best evidence.
  deal_type_tiers:
    # 1.0: full control of a whole company
    Leveraged Buyout: 1.0
    Platform Investment: 1.0
    Management Buyout: 1.0
    Bolt-on Acquisition: 1.0
    Strategic Acquisition: 1.0
    # 0.6: shows appetite for the space, but not a clean whole-company buy
    Recapitalization: 0.6
    Minority Investment: 0.6
    Carve-out: 0.6
    # 0.3: structurally unlike a private company sale; counts a little
    SPAC Merger: 0.3
    Merger of Equals: 0.3

  # --- Target profile -----------------------------------------------------
  # Past deal whose target was public or non-profit (a different sale process).
  ownership_miss: 0.7
  # Past deal in a different single region from the target's. Only used when
  # the target's region is known; deals marked National or Multi-Regional
  # always count fully.
  geography_miss: 0.7
  # Margin bands are judged within each sector: weak = below the sector
  # median, medium = median up to this percentile, strong = this percentile
  # or above. 0.65 = the top 35% of the sector counts as strong.
  margin_strong_percentile: 0.65
  # Past deal whose target had medium margins for its own sector
  # (strong margins = 1.0).
  margin_medium: 0.85
  # Past deal whose target had below-median margins for its own sector.
  margin_weak: 0.7

  # --- Recency ------------------------------------------------------------
  # Age is counted back from the latest year in the dataset, not today.
  # Each row: [up to this many years old, weight].
  # 0-1 years -> 1.0, 2-3 years -> 0.9, 4-6 years -> 0.75.
  recency_steps:
    - [1, 1.0]
    - [3, 0.9]
    - [6, 0.75]
  # Anything older. Decay is gentle: old deals still show the buyer has done this.
  recency_old: 0.6

  # --- Valuation ----------------------------------------------------------
  # Target revenue and EBITDA are estimated from peer deals (same sector and
  # margin band). Fewer peers than this -> the estimate is marked low confidence.
  min_estimate_peers: 5
  # The valuation comps table is the N most relevant closed deals.
  # Median EV/Revenue and EV/EBITDA are taken from these rows.
  top_n_comps: 20

  # --- Shortlist ----------------------------------------------------------
  # Most candidates each coverage agent (PE, strategic) may put forward.
  # If an agent fails, the top N from its ranking are used instead.
  pool_size: 8
  # Default split of the final 10. The deal captain may move one seat
  # either way (7/3 or 5/5) with a written reason.
  mix_pe: 6
  mix_strategic: 4
  # Neither buyer type can fall below this many seats.
  min_per_type: 3

  # --- Risk and conviction ------------------------------------------------
  # A risk is flagged when a buyer is worse than this share of buyers of its
  # own type (PE vs PE, strategic vs strategic). 0.75 = worst 25%.
  risk_percentile: 0.75
  # Integration risk counts deals in sectors weighted below this (far from ours).
  integration_sector_weight: 0.5
  # Financing risk also fires when the buyer's median deal is below this share
  # of the target's EV (0.5 = typically buys companies under half our size).
  financing_size_ratio: 0.5
  # Antitrust risk (strategics only): this many or more deals in the target's sector.
  antitrust_min_deals: 2
  # Ability is High when at most this many Value/Certainty/Speed risks fired.
  max_ability_risks: 1
  # A featured deal whose stated EV/EBITDA differs from ours (deal size /
  # EBITDA) by more than this share gets a caveat on the page.
  ebitda_mismatch: 0.25
  # A past deal at or above this relevance counts as a "strong precedent".
  strong_relevance: 0.4
  # High willingness needs at least two strong precedents, the latest one
  # in this year or later.
  recent_year: 2021


# ---------------------------------------------------------------------------
# coverage: how the PE and strategic coverage agents search for candidates.
# ---------------------------------------------------------------------------
coverage:
  # Sectors grouped by kind of business. A thesis searches the target's family
  # unless it names its own sectors.
  sector_families:
    provider_services: [Healthcare Services, Physician Groups, Behavioral Health,
                        Home Health/Hospice, Dental]
    payers: [Health Insurance]
    health_tech_and_services: [Health IT, Revenue Cycle]
    products: [Medical Devices, Pharma/Biotech]

  # Seed theses: the banker's stories for who might buy, each written as deal
  # search filters. They run in code before the agent's first turn.
  # size = [low, high] as multiples of the target's EV (0.375 x $200M = $75M).
  theses:
    P1:
      buyer_type: PE
      name: Platform builders
      story: PE firms that buy a company like ours as the base of a new healthcare
        platform, then grow it with add-ons.
      deal_types: [Platform Investment, Leveraged Buyout, Management Buyout]
      size: [0.375, 2.5]
      year_min: 2018
    P2:
      buyer_type: PE
      name: Add-on acquirers
      story: PE firms that already own a business in this space and would bolt ours on.
      deal_types: [Bolt-on Acquisition]
      size: [0.25, 2.5]
    P3:
      buyer_type: PE
      name: Roll-up players
      story: PE firms whose deals are about consolidating a fragmented market.
      tags_any: [Platform Build, Scale, Market Share]
      size: [0.375, 2.5]
      min_relevance: 0.2
    S1:
      buyer_type: Strategic
      name: Health systems expanding services
      story: Hospital and health systems buying services businesses to broaden
        what they offer or where they operate.
      deal_types: [Strategic Acquisition, Bolt-on Acquisition, Platform Investment,
                   Leveraged Buyout, Management Buyout]
      sectors: [Healthcare Services, Physician Groups]
      size: [0.25, 3.0]
    S3:
      buyer_type: Strategic
      name: Consolidators cross-selling
      story: Provider platforms buying adjacent services to cross-sell to their
        existing patients.
      tags_any: [Cross-sell, Diversification]
      size: [0.25, 3.0]

  rankings_top_k: 12   # how many ranked buyers each agent sees up front
  top_n: 10            # most buyers (or deals) one tool result lists
  max_tool_calls: 8    # most tool calls run in the agent's tool turn
  # A buyer whose median deal is below the first or above the second multiple
  # of our EV, with no deal in our size band, is screened out (0.5x-5x = $100M-$1B).
  size_far: [0.5, 5.0]


# ---------------------------------------------------------------------------
# validation: code checks on every one-page rationale before it ships.
# A failed page goes back to the analyst with the errors (at most
# max_repairs times), then ships as an evidence-only page marked for review.
# ---------------------------------------------------------------------------
validation:
  max_repairs: 2
  # Prose length per page, all sections together. Target is 350-450 words;
  # the slack stops wording alone from triggering a repair.
  page_words_min: 300
  page_words_max: 500
  # Phrases that could describe any buyer. A page using one is sent back.
  banned_phrases:
    - leading
    - well-positioned
    - well positioned
    - track record of strategic acquisitions
    - proven track record
    - strong track record
    - best-in-class
    - world-class
    - synergistic
    - uniquely positioned
  # Two pages whose fit theses are this similar (0 = no shared words,
  # 1 = identical) read like copies; both are sent back.
  max_thesis_similarity: 0.5
  # The lower-ranked page of a too-similar pair is rewritten only if at least
  # this many seconds of the run budget remain; otherwise both are flagged.
  rewrite_min_seconds: 10


# ---------------------------------------------------------------------------
# llm: model choice and how calls behave. Read by the LLM client and the
# graph's node wrapper.
# ---------------------------------------------------------------------------
llm:
  provider: anthropic

  # One profile per kind of call.
  #   model      - which Claude model answers
  #   effort     - how hard it thinks: low | medium | high (more = slower, better)
  #   thinking   - adaptive (thinks when useful) or between_tools (no thinking
  #                before answering; used where the reasoning was done in an
  #                earlier step)
  #   max_tokens - longest answer allowed, thinking included
  # No temperature setting: the API no longer accepts one. Repeat runs are made
  # identical by the answer cache instead.
  profiles:
    intake:          # short parsing task
      model: claude-haiku-5-5
      effort: low
      max_tokens: 4000
    coverage:        # tool loops that build each candidate pool
      model: claude-sonnet-5-5
      effort: medium
      max_tokens: 16000
    captain:         # picks the final 10
      model: claude-sonnet-5-5
      effort: medium
      max_tokens: 16000
    analyst_notes:   # step A: reason about one buyer
      model: claude-sonnet-5-5
      effort: medium
      max_tokens: 8000
    analyst_write:   # step B: write the page from the notes
      model: claude-sonnet-5-5
      effort: low
      thinking: between_tools
      max_tokens: 8000

  # Most LLM calls running at the same time (e.g. the 10 analysts in parallel).
  max_concurrency: 10

  # Retries apply to rate limits (429), server errors (5xx, incl. 529 overloaded)
  # and dropped connections; never to bad requests. Waits 0.5 s, then 1 s, never
  # more than 2 s, with random jitter; a retry-after header from the API wins.
  # A retry only starts if at least min_attempt_seconds of the step's time
  # limit would remain after the wait; otherwise the step falls back.
  retries:
    max_retries: 2
    base_seconds: 0.5
    cap_seconds: 2.0
    min_attempt_seconds: 3.0

  # Time limit per step, in seconds. On timeout the step falls back to a
  # rule-based result so the run always finishes:
  #   intake   -> default_target (only for the default text; otherwise stop)
  #   coverage -> top candidates from the ranking
  #   captain  -> default 6/4 split in ranking order
  #   analyst  -> evidence-only page marked "needs review"
  timeouts_seconds:
    intake: 10
    coverage: 20
    captain: 10
    analyst: 25      # notes + write; room for one repair

  # Time limit for the whole run. Every step's deadline is the earlier of its
  # own limit above and the time left in this budget, so a slow early step
  # can't push the run past it: later steps fall back instead.
  run_budget_seconds: 55
