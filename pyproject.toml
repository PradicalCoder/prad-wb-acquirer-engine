[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acquirer-engine"
version = "0.1.0"
description = "Agentic M&A acquirer identification engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "jinja2>=3.1",
    "structlog>=24.1",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "opentelemetry-sdk>=1.25",
    "openinference-instrumentation-langchain>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
acquirer-engine = "acquirer_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/acquirer_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
